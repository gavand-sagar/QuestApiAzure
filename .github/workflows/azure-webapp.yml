name: Build and Deploy .NET 8 API to Azure Web App

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: my-dotnet-api-sagar-delete
  PROJECT_PATH: ./YourApi/YourApi.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      - name: Azure Login
        uses: :contentReference[oaicite:1]{index=1}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: :contentReference[oaicite:2]{index=2}
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish